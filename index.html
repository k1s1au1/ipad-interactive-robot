<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
  <meta name="theme-color" content="#08162f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Robot Quest" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Robot Quest</title>
</head>
<body>
  <main id="game">
    <canvas id="scene" aria-label="لعبة منصات ثلاثية الأبعاد"></canvas>

    <section id="startScreen" class="screen">
      <div class="panel">
        <div class="logoMark">RQ</div>
        <h1>Robot Quest</h1>
        <p>مغامرة منصات سريعة بروح مرحة، مصممة للآيباد.</p>
        <button id="startBtn" type="button">ابدأ اللعب</button>
        <small>حرّك الروبوت، اقفز، اندفع، اجمع النجوم وأنقذ الرفقاء.</small>
      </div>
    </section>

    <section id="hud" aria-label="واجهة اللعب">
      <div class="hudLeft">
        <div class="pill"><span class="dot starDot"></span><span id="stars">0</span><span>/ 8</span></div>
        <div class="pill"><span class="dot friendDot"></span><span id="friends">0</span><span>/ 3</span></div>
      </div>
      <div class="hudRight">
        <div id="hearts" class="hearts" aria-label="الصحة">♥ ♥ ♥</div>
        <button id="pauseBtn" type="button" aria-label="إيقاف مؤقت">Ⅱ</button>
      </div>
    </section>

    <div id="message" role="status" aria-live="polite"></div>

    <section id="touchControls" aria-label="أزرار التحكم">
      <div id="stickZone" class="stickZone" aria-label="عصا الحركة">
        <div class="stickBase"><div id="stickKnob" class="stickKnob"></div></div>
      </div>
      <div class="actions">
        <button id="spinBtn" class="action spin" type="button" aria-label="دوران">↻</button>
        <button id="dashBtn" class="action dash" type="button" aria-label="اندفاع">»</button>
        <button id="jumpBtn" class="action jump" type="button" aria-label="قفز">↑</button>
      </div>
    </section>

    <section id="pauseScreen" class="screen hidden">
      <div class="panel compact">
        <h2>متوقف مؤقتاً</h2>
        <button id="resumeBtn" type="button">متابعة</button>
        <button id="restartBtn" class="secondary" type="button">إعادة المرحلة</button>
      </div>
    </section>

    <section id="winScreen" class="screen hidden">
      <div class="panel">
        <div class="winIcon">★</div>
        <h2>أنهيت المرحلة!</h2>
        <p id="resultText"></p>
        <button id="playAgainBtn" type="button">العب مرة ثانية</button>
      </div>
    </section>

    <div id="portrait">
      <div class="rotate">↻</div>
      <div>دوّر الآيباد للوضع الأفقي</div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
